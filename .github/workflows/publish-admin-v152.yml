name: Publish MCU Tracker Admin v1.5.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/app-admin-v152.py'
      - '.github/workflows/publish-admin-v152.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply admin role patch
        run: python .github/scripts/app-admin-v152.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/index.html').read_text(encoding='utf-8')
          a=s.find('<script>')+8
          b=s.rfind('</script>')
          Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Publish v1.5.2 content
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/latest.json app/index.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MCU Tracker app v1.5.2 admin panel'
          git push
