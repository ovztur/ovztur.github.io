name: Publish MCU Tracker Admin v1.5.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/app-admin-v152.py'
      - '.github/workflows/publish-admin-v152.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply admin role patch
        run: python .github/scripts/app-admin-v152.py

      - name: Force raw GitHub content URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/latest.json')
          s=p.read_text(encoding='utf-8')
          s=s.replace('https://ovztur.github.io/app/index.html','https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks:
              raise SystemExit('No script blocks found')
          for i,b in enumerate(blocks):
              Path(f'/tmp/app_{i}.js').write_text(b,encoding='utf-8')
          print(len(blocks))
          PY
          for f in /tmp/app_*.js; do node --check "$f"; done

      - name: Publish v1.5.2 content
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/latest.json app/index.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MCU Tracker app v1.5.2 admin panel'
          git push
