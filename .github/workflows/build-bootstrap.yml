name: Build MCU Tracker Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/main.go'
      - '.github/workflows/build-bootstrap.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Create embedded icon
        shell: bash
        run: |
          printf '%s' 'AAABAAEAICAAAAAAIABqAAAAFgAAAIlQTkcNChoKAAAADUlIRFIAAAAgAAAAIAgGAAAAc3p69AAAADFJREFUeJztzkERACAMwLCCEPwfJkHGPqmBZt3Oa7A9OQcAAAAAAAAAAAAAAAAAAKj6ucICB3/f3NwAAAAASUVORK5CYII=' | base64 -d > bootstrap/MCU_Tracker_Logo.ico

      - name: Build Windows x64
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p downloads bootstrap
          go build -ldflags='-s -w -H=windowsgui' -o downloads/MCU_Tracker_Ultimate_v1.5.1.exe ./bootstrap/main.go

      - name: Generate checksum and manifest
        shell: bash
        run: |
          SHA=$(sha256sum downloads/MCU_Tracker_Ultimate_v1.5.1.exe | awk '{print $1}')
          printf '%s  %s\n' "$SHA" 'MCU_Tracker_Ultimate_v1.5.1.exe' > downloads/MCU_Tracker_Ultimate_v1.5.1.sha256
          mkdir -p bootstrap
          cat > bootstrap/latest.json <<EOF
          {
            "version": "1.5.1",
            "url": "https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/downloads/MCU_Tracker_Ultimate_v1.5.1.exe",
            "sha256": "$SHA",
            "notes": "MCU Tracker otomatik güncelleme bootstrap sürümü. Raw GitHub indirme adresi kullanılır."
          }
          EOF

      - name: Publish generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/MCU_Tracker_Ultimate_v1.5.1.exe downloads/MCU_Tracker_Ultimate_v1.5.1.sha256 bootstrap/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Build MCU Tracker v1.5.1 bootstrap'
          git push
