name: Publish MCU Tracker v1.6.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/telemetry.js'
      - 'config/analytics.json'
      - '.github/scripts/publish-v161.py'
      - '.github/workflows/publish-v161.yml'

permissions:
  contents: write

concurrency:
  group: mcu-app-content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish v1.6.1 app manifest
        run: python .github/scripts/publish-v161.py

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app/telemetry.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('app/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          for i,b in enumerate(blocks):
              p=Path(f'/tmp/app-{i}.js')
              p.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(r.returncode)
          PY

      - name: Commit v1.6.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json app/telemetry.js config/analytics.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MCU Tracker v1.6.1 in-app live admin panel'
          git pull --rebase origin main
          git push origin main
