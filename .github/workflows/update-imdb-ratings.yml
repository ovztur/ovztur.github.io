name: Update MCU IMDb Ratings

on:
  push:
    paths:
      - '.github/workflows/update-imdb-ratings.yml'
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official IMDb ratings dataset
        run: |
          curl -fsSL --retry 3 --retry-delay 3 \
            https://datasets.imdbws.com/title.ratings.tsv.gz \
            -o /tmp/title.ratings.tsv.gz

      - name: Build small MCU ratings file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, json, re, time

          index = Path('app/index.html').read_text(encoding='utf-8')
          wanted = set(re.findall(r'id:"(tt\d+)"', index))
          if not wanted:
              raise SystemExit('No IMDb title ids found in app/index.html')

          found = {}
          with gzip.open('/tmp/title.ratings.tsv.gz', 'rt', encoding='utf-8') as fh:
              next(fh, None)
              for line in fh:
                  tconst, rating, votes = line.rstrip('\n').split('\t')
                  if tconst in wanted:
                      found[tconst] = {
                          'rating': float(rating),
                          'votes': int(votes),
                      }
                      if len(found) == len(wanted):
                          break

          if not found:
              raise SystemExit('No matching IMDb ratings found')

          payload = {
              'updatedAt': int(time.time() * 1000),
              'source': 'IMDb Non-Commercial Datasets / title.ratings.tsv.gz',
              'titles': dict(sorted(found.items())),
          }
          out = 'window.MCU_IMDB_RATINGS=' + json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + ';\n'
          Path('app/imdb-ratings-data.js').write_text(out, encoding='utf-8')
          print(f'ratings: {len(found)} / ids: {len(wanted)}')
          PY

      - name: Commit refreshed ratings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/imdb-ratings-data.js
          if git diff --cached --quiet; then
            echo 'No rating changes.'
            exit 0
          fi
          git commit -m 'Refresh MCU IMDb ratings'
          git push
