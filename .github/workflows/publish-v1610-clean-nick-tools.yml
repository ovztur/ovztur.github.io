name: Publish MCU Tracker v1.6.10 Clean Nick Tools

on:
  push:
    paths:
      - '.github/workflows/publish-v1610-clean-nick-tools.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch separate nickname tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          tp=Path('app/telemetry.js')
          s=tp.read_text(encoding='utf-8')
          s=re.sub(r"const VERSION='[^']+';", "const VERSION='1.6.10-lite';", s, count=1)

          start_marker="    const list=Object.values(users),admins=list.filter(admin),nickBox=primary(current)?`"
          host_marker="    host.innerHTML=`"
          start=s.find(start_marker)
          if start < 0:
              raise SystemExit('nickBox start not found')
          host=s.find(host_marker,start)
          if host < 0:
              raise SystemExit('host marker not found')
          replacement="""    const list=Object.values(users),admins=list.filter(admin);
    const adminNickBox=primary(current)?`<section class=\"panel\"><h3 style=\"margin-top:0\">👑 Nick ile Admin Yap</h3><p class=\"meta\">Admin yapmak istediğin kayıtlı hesabın nickini yaz.</p><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><input id=\"mcuAdminNick\" class=\"search\" style=\"flex:1;min-width:220px\" placeholder=\"Admin yapılacak nick / örn. peter\"><button id=\"mcuGrantNickBtn\">Admin Yap</button></div><div id=\"mcuAdminNickStatus\" class=\"meta\" style=\"margin-top:8px\">${esc(message)}</div></section>`:'';
    const deleteNickBox=primary(current)?`<section class=\"panel\"><h3 style=\"margin-top:0\">🗑️ Nick ile Hesap Sil</h3><p class=\"meta\">Silmek istediğin hesabın nickini yaz. ovztur Ana Admin hesabı silinemez.</p><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><input id=\"mcuDeleteNick\" class=\"search\" style=\"flex:1;min-width:220px\" placeholder=\"Silinecek nick / örn. peter\"><button id=\"mcuDeleteNickBtn\" class=\"secondary\">🗑️ Hesabı Sil</button></div><div id=\"mcuDeleteNickStatus\" class=\"meta\" style=\"margin-top:8px\"></div></section>`:'';
"""
          s=s[:start]+replacement+s[host:]
          old='${nickBox}<section class="panel"><h3 style="margin-top:0">🌐 Canlı Kullanım</h3>'
          new='${adminNickBox}${deleteNickBox}<section class="panel"><h3 style="margin-top:0">🌐 Canlı Kullanım</h3>'
          if old not in s:
              raise SystemExit('nickBox host insertion not found')
          s=s.replace(old,new,1)

          handler_start="    const nickInput=document.getElementById('mcuAdminNick')"
          handler_end="    document.querySelectorAll('[data-admin-action]')"
          hs=s.find(handler_start)
          he=s.find(handler_end,hs)
          if hs < 0 or he < 0:
              raise SystemExit('handler block not found')
          handlers="""    const adminNickInput=document.getElementById('mcuAdminNick'),grantBtn=document.getElementById('mcuGrantNickBtn');
    const deleteNickInput=document.getElementById('mcuDeleteNick'),deleteBtn=document.getElementById('mcuDeleteNickBtn');
    const doGrant=()=>{if(!adminNickInput)return;const r=grantByNick(adminNickInput.value);renderAdmin(r.msg)};
    const doDelete=()=>{if(!deleteNickInput)return;const nick=deleteNickInput.value.trim();const status=document.getElementById('mcuDeleteNickStatus');if(!nick){if(status)status.textContent='Silmek için bir kullanıcı nicki gir.';return}if(!confirm(`@${nick} hesabı silinsin mi?\\n\\nBu hesabın yerel ilerleme, XP, kupa, favori, not ve puan verileri de silinecek.`))return;if(!confirm(`SON ONAY: @${nick} hesabını kalıcı olarak silmek istediğine emin misin?`))return;const r=deleteByNick(nick);if(r.ok)renderAdmin(r.msg);else if(status)status.textContent=r.msg};
    if(grantBtn)grantBtn.onclick=doGrant;if(deleteBtn)deleteBtn.onclick=doDelete;
    if(adminNickInput)adminNickInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doGrant()}});
    if(deleteNickInput)deleteNickInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doDelete()}});

"""
          s=s[:hs]+handlers+s[he:]
          tp.write_text(s,encoding='utf-8')

          ap=Path('app/account-delete.js')
          a=ap.read_text(encoding='utf-8')
          a=re.sub(r"const VERSION='[^']+';", "const VERSION='1.6.10';", a, count=1)
          inject_marker="    const nick=document.getElementById('mcuAdminNick'),grant=document.getElementById('mcuGrantNickBtn');"
          ai=a.find(inject_marker)
          aend=a.find("\n  }\n\n  function refresh",ai)
          if ai < 0 or aend < 0:
              raise SystemExit('old admin-box delete injector not found')
          a=a[:ai]+a[aend:]
          ap.write_text(a,encoding='utf-8')

          p=Path('app/index.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'https://ovztur\.github\.io/app/telemetry\.js\?v=[^"\']+', 'https://ovztur.github.io/app/telemetry.js?v=1.6.10', html)
          html=re.sub(r'https://ovztur\.github\.io/app/account-delete\.js\?v=[^"\']+', 'https://ovztur.github.io/app/account-delete.js?v=1.6.10', html)
          html=re.sub(r'const MCU_APP_VERSION="[^"]+";', 'const MCU_APP_VERSION="1.6.10";', html)
          p.write_text(html,encoding='utf-8')

          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('app/latest.json').write_text(json.dumps({
            'version':'1.6.10',
            'url':'https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html',
            'sha256':sha,
            'notes':'Nick ile Admin Yap kutusundan Hesabı Sil kaldırıldı. Nick ile Hesap Sil ayrı kutu olarak bırakıldı.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('app/index.sha256').write_text(f'{sha}  index.html\n',encoding='utf-8')
          print('sha256',sha)
          PY

      - name: Validate JavaScript
        run: |
          node --check app/telemetry.js
          node --check app/account-delete.js

      - name: Commit v1.6.10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/telemetry.js app/account-delete.js app/index.html app/latest.json app/index.sha256
          git commit -m 'Publish MCU Tracker v1.6.10 clean nick tools'
          git push
