name: Publish MCU Tracker v1.6.7 User Access

on:
  push:
    paths:
      - '.github/workflows/publish-v167-user-access.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch normal user access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')

          # Never force first-time Admin setup. Always show Login/Register for ordinary users.
          s=s.replace('if(!hasAdmin)mode="setup";','if(mode==="setup"&&hasAdmin)mode="login";')
          s=s.replace('else showAuth(hasAdmin?"login":"setup")','else showAuth("login")')

          # If someone explicitly registers the reserved ovztur name on a fresh profile,
          # preserve it as the primary admin; every other account remains a normal user.
          s=s.replace('users[key]={key,username:name,displayName:display,role:"user",passwordHash:await hashPassword(pass),createdAt:Date.now()};',
                      'users[key]={key,username:name,displayName:display,role:(key==="ovztur"?"admin":"user"),isPrimaryAdmin:key==="ovztur",passwordHash:await hashPassword(pass),createdAt:Date.now()};')

          # User login must never depend on role. loginUser already accepts all accounts;
          # keep Admin Panel permission isolated to isAdmin().
          s=re.sub(r'https://ovztur\.github\.io/app/telemetry\.js\?v=[^"\']+', 'https://ovztur.github.io/app/telemetry.js?v=1.6.7', s)
          s=re.sub(r'const MCU_APP_VERSION="[^"]+";', 'const MCU_APP_VERSION="1.6.7";', s)

          # Add a clear note on the auth form.
          s=s.replace('Her hesap kendi izleme, favori, not, XP ve kupa ilerlemesini tutar.',
                      'Normal kullanıcılar da uygulamayı kullanabilir. Her hesap kendi izleme, favori, not, XP ve kupa ilerlemesini tutar.')

          p.write_text(s,encoding='utf-8')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('app/latest.json').write_text(json.dumps({
            'version':'1.6.7',
            'url':'https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html',
            'sha256':sha,
            'notes':'Normal kullanıcı erişimi açıldı. Giriş/Kayıt ekranı admin hesabı olmadan da kullanılabilir; Admin Paneli yalnızca adminlere görünür.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('app/index.sha256').write_text(f'{sha}  index.html\n',encoding='utf-8')
          print('sha256',sha)
          PY

      - name: Validate inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('app/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              path=f'/tmp/mcu-inline-{i}.js'
              Path(path).write_text(b,encoding='utf-8')
              subprocess.run(['node','--check',path],check=True)
          PY
          node --check app/telemetry.js

      - name: Verify user access patch
        shell: bash
        run: |
          grep -q 'else showAuth("login")' app/index.html
          grep -q 'Normal kullanıcılar da uygulamayı kullanabilir' app/index.html
          grep -q 'role:(key==="ovztur"?"admin":"user")' app/index.html

      - name: Commit v1.6.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/latest.json app/index.sha256
          git commit -m 'Publish MCU Tracker v1.6.7 normal user access'
          git push
