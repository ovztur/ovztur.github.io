name: Publish MCU Tracker v1.6.15 Anonymous Admin Notes

on:
  push:
    paths:
      - '.github/workflows/publish-v1615-anonymous-admin-notes.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release notes script
        run: node --check app/release-notes.js

      - name: Patch app version and cache keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          version='1.6.15'
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const MCU_APP_VERSION="[^"]+";', f'const MCU_APP_VERSION="{version}";', s, count=1)
          for name in ('telemetry.js','account-delete.js','release-notes.js'):
              s=re.sub(rf'(https://ovztur\.github\.io/app/{re.escape(name)}\?v=)[^"<]+', rf'\g<1>{version}', s)
          p.write_text(s,encoding='utf-8')

          if s.count('app/release-notes.js?v=1.6.15') != 1:
              raise SystemExit('release-notes cache key not unique')

          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('app/index.sha256').write_text(f'{sha}  index.html\n',encoding='utf-8')
          Path('app/latest.json').write_text(json.dumps({
              'version':version,
              'url':'https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html',
              'sha256':sha,
              'notes':'Güncelleme Notları herkese açık kalır; Ana Admin kullanıcı adı herkese açık notlarda anonimleştirildi.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json
          git commit -m 'Publish MCU Tracker v1.6.15 anonymous admin notes'
          git push
