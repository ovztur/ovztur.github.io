name: Publish MCU Tracker v1.6.14 Release Notes

on:
  push:
    paths:
      - '.github/workflows/publish-v1614-release-notes.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app/account-delete.js
          node --check app/release-notes.js

      - name: Patch app index and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          version='1.6.14'
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')

          s=re.sub(r'const MCU_APP_VERSION="[^"]+";', f'const MCU_APP_VERSION="{version}";', s, count=1)

          for name in ('telemetry.js','account-delete.js','release-notes.js'):
              s=re.sub(rf'<script\s+src="https://ovztur\.github\.io/app/{re.escape(name)}\?v=[^"]+"\s*></script>', '', s)

          tags=(
              f'<script src="https://ovztur.github.io/app/telemetry.js?v={version}"></script>'
              f'<script src="https://ovztur.github.io/app/account-delete.js?v={version}"></script>'
              f'<script src="https://ovztur.github.io/app/release-notes.js?v={version}"></script>'
          )
          if '</body>' not in s:
              raise SystemExit('body close tag missing')
          s=s.replace('</body>', tags+'</body>', 1)

          if s.count('app/account-delete.js?v=1.6.14') != 1:
              raise SystemExit('account-delete script tag not unique')
          if s.count('app/release-notes.js?v=1.6.14') != 1:
              raise SystemExit('release-notes script tag not unique')
          if s.count('app/telemetry.js?v=1.6.14') != 1:
              raise SystemExit('telemetry script tag not unique')

          p.write_text(s,encoding='utf-8')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('app/index.sha256').write_text(f'{sha}  index.html\n',encoding='utf-8')
          Path('app/latest.json').write_text(json.dumps({
              'version':version,
              'url':'https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html',
              'sha256':sha,
              'notes':'Kullanıcılar için görünür Hesabımı Sil butonu ve uygulama içi Güncelleme Notları sekmesi eklendi.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published',version,sha)
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json
          git commit -m 'Publish MCU Tracker v1.6.14 release notes and self delete'
          git push
