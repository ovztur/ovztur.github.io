name: Publish MCU Tracker v1.6.2 Repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/fix-local-admin-v162.py'
      - '.github/workflows/publish-v162.yml'
      - 'app/telemetry.js'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply admin recovery patch
        run: python .github/scripts/fix-local-admin-v162.py
      - name: Validate JavaScript blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('app/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              p=Path(f'/tmp/app-{i}.js');p.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);sys.exit(r.returncode)
          r=subprocess.run(['node','--check','app/telemetry.js'],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr);sys.exit(r.returncode)
          PY
      - name: Publish v1.6.2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json app/telemetry.js
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MCU Tracker v1.6.2 admin recovery'
          git pull --rebase origin main
          git push origin main
