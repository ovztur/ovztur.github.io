name: Publish MCU Tracker v1.6.7 Account Delete

on:
  push:
    paths:
      - '.github/workflows/publish-v167-account-delete.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app/telemetry.js
          node --check app/account-delete.js

      - name: Patch app to v1.6.7
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'https://ovztur\.github\.io/app/telemetry\.js\?v=[^"\']+', 'https://ovztur.github.io/app/telemetry.js?v=1.6.7', s)
          delete_tag='<script src="https://ovztur.github.io/app/account-delete.js?v=1.6.7"></script>'
          s=re.sub(r'<script src="https://ovztur\.github\.io/app/account-delete\.js\?v=[^"]+"></script>', '', s)
          if '</body>' in s:
              s=s.replace('</body>',delete_tag+'</body>',1)
          else:
              s+=delete_tag
          s=re.sub(r'const MCU_APP_VERSION="[^"]+";', 'const MCU_APP_VERSION="1.6.7";', s)
          p.write_text(s,encoding='utf-8')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('app/latest.json').write_text(json.dumps({
            'version':'1.6.7',
            'url':'https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html',
            'sha256':sha,
            'notes':'Hesap silme eklendi: normal kullanıcı kendi hesabını silebilir; ovztur Ana Admin kendisi hariç tüm yerel hesapları silebilir.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('app/index.sha256').write_text(f'{sha}  index.html\n',encoding='utf-8')
          print('sha256',sha)
          PY

      - name: Commit v1.6.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/latest.json app/index.sha256
          git commit -m 'Publish MCU Tracker v1.6.7 account deletion'
          git push
