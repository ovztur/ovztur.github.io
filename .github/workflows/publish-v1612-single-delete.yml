name: Publish MCU Tracker v1.6.12 Single Delete

on:
  push:
    paths:
      - '.github/workflows/publish-v1612-single-delete.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch single delete UI
        run: python3 .github/scripts/patch-v1612-single-delete.py
      - name: Validate JavaScript
        run: |
          node --check app/telemetry.js
          node --check app/account-delete.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/telemetry.js app/account-delete.js app/index.html app/latest.json app/index.sha256
          git commit -m 'Publish MCU Tracker v1.6.12 single delete UI'
          git pull --rebase origin main
          git push origin main
