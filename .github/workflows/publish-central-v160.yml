name: Publish MCU Tracker Central Auth v1.6.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/central-auth-v160.js'
      - '.github/scripts/publish-central-v160.py'
      - '.github/scripts/patch-site-v160.py'
      - '.github/workflows/publish-central-v160.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live app
        run: python .github/scripts/publish-central-v160.py
      - name: Patch website
        run: python .github/scripts/patch-site-v160.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source in ['app/index.html','index.html']:
              s=Path(source).read_text(encoding='utf-8')
              blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
              for i,b in enumerate(blocks):
                  Path(f'/tmp/{Path(source).stem}-{i}.js').write_text(b,encoding='utf-8')
          PY
          for f in /tmp/index-*.js; do node --check "$f"; done
      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MCU Tracker v1.6.0 web central auth'
          git push
