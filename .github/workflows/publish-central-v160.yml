name: Publish MCU Tracker Central Auth v1.6.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/central-auth-v160.js'
      - '.github/scripts/publish-central-v160.py'
      - '.github/workflows/publish-central-v160.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live app
        run: python .github/scripts/publish-central-v160.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app/index.html').read_text(encoding='utf-8')
          a=s.find('<script>')+8
          b=s.rfind('</script>')
          Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish MCU Tracker v1.6.0 central auth'
          git push
