name: Patch MCU Tracker v1.6.17 Star Rating

on:
  push:
    paths:
      - '.github/workflows/patch-v1617-star-rating.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate star rating module
        run: node --check app/star-rating.js

      - name: Add star rating to v1.6.17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib

          version='1.6.17'
          p=Path('app/index.html')
          s=p.read_text(encoding='utf-8')

          # Same release version: only add/refresh the star rating module.
          s=re.sub(r'<script\s+src="https://ovztur\.github\.io/app/star-rating\.js\?v=[^"]+"\s*></script>', '', s)
          tag=f'<script src="https://ovztur.github.io/app/star-rating.js?v={version}"></script>'
          if '</body>' not in s:
              raise SystemExit('body close tag missing')
          s=s.replace('</body>', tag+'</body>', 1)

          if s.count(f'app/star-rating.js?v={version}') != 1:
              raise SystemExit('star-rating script tag is not unique')
          if f'const MCU_APP_VERSION="{version}";' not in s:
              raise SystemExit('app is no longer v1.6.17')

          p.write_text(s,encoding='utf-8')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('app/index.sha256').write_text(f'{sha}  index.html\n',encoding='utf-8')
          Path('app/latest.json').write_text(json.dumps({
              'version':version,
              'url':'https://raw.githubusercontent.com/ovztur/ovztur.github.io/main/app/index.html',
              'sha256':sha,
              'notes':'IMDb puan yükleme düzeltmesine ek olarak kişisel film puanlama alanı 10 yıldızlı sisteme dönüştürüldü. Seçilen yıldıza kadar tüm yıldızlar işaretlenir.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('patched',version,sha)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/index.html app/index.sha256 app/latest.json
          git commit -m 'Add star rating UI to MCU Tracker v1.6.17'
          git push
